openapi: 3.1.0
info:
  title: KZ-RU Emotion Analysis API
  version: 1.0.0-draft
  summary: Emotion, polarity and language detection for Kazakh, Russian and code-switched texts.
  description: |
    Public REST API of the KZ-RU Emotion Analysis Platform (DOC-08).

    * **Single-text analysis** is synchronous: `POST /analyze`.
    * **Batch analysis** is asynchronous: upload a file with `POST /batches`, poll
      `GET /batches/{batch_id}` until `status = completed`, then read `/items`, `/stats`
      or `/export`.

    Emotion labels: `joy`, `sadness`, `anger`, `fear`, `surprise`, `neutral`.
    Polarity is derived from the emotion (FR-03): joy → positive; sadness, anger, fear →
    negative; surprise, neutral → neutral. Language tags: `kk`, `ru`, `mixed`.

    **Status of this document:** draft contract for pre-defense-1. From implementation
    onwards this file is generated by FastAPI and checked for drift in CI (NFR-11).
    Requirement IDs in descriptions refer to DOC-06.
  contact:
    name: Ulan Orazbek, Nurgaly Ashkenov (SE-2406)
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://localhost/api/v1
    description: Local Docker Compose stack behind Nginx
tags:
  - name: Analysis
    description: Single-text analysis (FR-01–FR-04)
  - name: Batches
    description: Batch upload, processing status, results, statistics, export (FR-05–FR-13, FR-16)
  - name: Feedback
    description: Analyst label corrections (FR-19, Could)
  - name: Auth
    description: Web-session authentication (FR-15)
  - name: Admin
    description: API keys, users, system status (FR-14, FR-17)
  - name: System
    description: Health and model information (FR-18)

security:
  - ApiKeyAuth: []
  - SessionCookie: []

paths:
  /analyze:
    post:
      tags: [Analysis]
      operationId: analyzeText
      summary: Analyse a single text
      description: |
        Returns the emotion, class probabilities, derived polarity and detected language of one text
        (FR-01, FR-02, FR-03). The text is **not stored** unless `store` is `true` (AC-01.5).
        Rate limit: 60 requests per minute per API key by default (AC-14.4).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyzeRequest' }
            examples:
              kazakh:
                summary: Kazakh complaint
                value:
                  text: "Қосымша өте баяу жұмыс істейді, ақшам екі рет есептен шығып кетті!"
              mixed:
                summary: Code-switched Kazakh–Russian
                value:
                  text: "Доставка вообще кешікті, курьер телефон алмады, очень недоволен"
                  store: false
              russian:
                summary: Russian positive feedback
                value:
                  text: "Спасибо большое, оператор быстро решил проблему!"
      responses:
        '200':
          description: Analysis result
          headers:
            X-Request-ID: { $ref: '#/components/headers/X-Request-ID' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyzeResponse' }
              examples:
                kazakh:
                  summary: Result for the Kazakh complaint
                  value:
                    request_id: "req_01JB7Q3M9W4T2K"
                    text_length: 66
                    language: kk
                    emotion: anger
                    polarity: negative
                    confidence: 0.87
                    probabilities: { joy: 0.01, sadness: 0.06, anger: 0.87, fear: 0.03, surprise: 0.01, neutral: 0.02 }
                    truncated: false
                    model_version: "emotion-xlmr-kkru-v0.1.0"
                    processing_ms: 412
                mixed:
                  summary: Result for the code-switched text
                  value:
                    request_id: "req_01JB7Q4A2Z8N5C"
                    text_length: 63
                    language: mixed
                    emotion: anger
                    polarity: negative
                    confidence: 0.74
                    probabilities: { joy: 0.01, sadness: 0.18, anger: 0.74, fear: 0.02, surprise: 0.02, neutral: 0.03 }
                    truncated: false
                    model_version: "emotion-xlmr-kkru-v0.1.0"
                    processing_ms: 398
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/TextValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ModelUnavailable' }

  /batches:
    post:
      tags: [Batches]
      operationId: createBatch
      summary: Upload a file for asynchronous batch analysis
      description: |
        Accepts CSV (UTF-8, comma or semicolon), XLSX (first sheet) or TXT (one text per line), up to
        **10 MB** and **50,000** items (FR-05). Only cheap checks are done synchronously; processing
        happens in the background (FR-07). Returns `202 Accepted` with the new batch.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/BatchUpload' }
            encoding:
              file:
                contentType: text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, text/plain
      responses:
        '202':
          description: Batch accepted and queued
          headers:
            Location:
              description: URL of the created batch
              schema: { type: string, example: /api/v1/batches/7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
              examples:
                queued:
                  value:
                    id: "7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57"
                    name: "Bank app reviews — October"
                    original_filename: "reviews_october.csv"
                    file_format: csv
                    status: queued
                    progress: 0
                    total_count: 0
                    processed_count: 0
                    skipped_count: 0
                    truncated_count: 0
                    invalid_date_count: 0
                    column_map: { text_column: "review", date_column: "created", channel_column: "source" }
                    model_version: "emotion-xlmr-kkru-v0.1.0"
                    error_message: null
                    created_at: "2026-10-20T10:15:02Z"
                    started_at: null
                    finished_at: null
                    expires_at: "2026-11-19T10:15:02Z"
                    links:
                      self: "/api/v1/batches/7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57"
                      items: "/api/v1/batches/7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57/items"
                      stats: "/api/v1/batches/7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57/stats"
                      export: "/api/v1/batches/7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57/export?format=csv"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/BatchTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFile' }
        '422': { $ref: '#/components/responses/TextColumnNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Batches]
      operationId: listBatches
      summary: List own batches (admins see all)
      description: Batch history, newest first (FR-16, AC-16.1).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BatchStatus' }
      responses:
        '200':
          description: Page of batches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /batches/{batch_id}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Batches]
      operationId: getBatch
      summary: Get batch status and progress
      description: Poll this endpoint (the Web UI does it every 3 s) until `status` is final (FR-07).
      responses:
        '200':
          description: Batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
              examples:
                processing:
                  value:
                    id: "7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57"
                    name: "Bank app reviews — October"
                    original_filename: "reviews_october.csv"
                    file_format: csv
                    status: processing
                    progress: 41.6
                    total_count: 8412
                    processed_count: 3500
                    skipped_count: 12
                    truncated_count: 3
                    invalid_date_count: 0
                    column_map: { text_column: "review", date_column: "created", channel_column: "source" }
                    model_version: "emotion-xlmr-kkru-v0.1.0"
                    error_message: null
                    created_at: "2026-10-20T10:15:02Z"
                    started_at: "2026-10-20T10:15:04Z"
                    finished_at: null
                    expires_at: "2026-11-19T10:15:02Z"
                    links:
                      self: "/api/v1/batches/7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57"
                      items: "/api/v1/batches/7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57/items"
                      stats: "/api/v1/batches/7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57/stats"
                      export: "/api/v1/batches/7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57/export?format=csv"
                failed:
                  value:
                    id: "0b9e4d21-8c3a-4f7e-b5d2-6a1c9e3f8b40"
                    name: "Akimat appeals Q3"
                    original_filename: "appeals_q3.xlsx"
                    file_format: xlsx
                    status: failed
                    progress: 62.5
                    total_count: 2048
                    processed_count: 1280
                    skipped_count: 0
                    truncated_count: 0
                    invalid_date_count: 4
                    column_map: { text_column: "Мәтін", date_column: "Күні", channel_column: null }
                    model_version: "emotion-xlmr-kkru-v0.1.0"
                    error_message: "ML service unavailable after 3 retries (chunk 21 of 32)"
                    created_at: "2026-10-19T08:00:00Z"
                    started_at: "2026-10-19T08:00:03Z"
                    finished_at: "2026-10-19T08:04:51Z"
                    expires_at: "2026-11-18T08:00:00Z"
                    links:
                      self: "/api/v1/batches/0b9e4d21-8c3a-4f7e-b5d2-6a1c9e3f8b40"
                      items: "/api/v1/batches/0b9e4d21-8c3a-4f7e-b5d2-6a1c9e3f8b40/items"
                      stats: "/api/v1/batches/0b9e4d21-8c3a-4f7e-b5d2-6a1c9e3f8b40/stats"
                      export: "/api/v1/batches/0b9e4d21-8c3a-4f7e-b5d2-6a1c9e3f8b40/export?format=csv"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Batches]
      operationId: deleteBatch
      summary: Delete a batch with its file, items, predictions and statistics
      description: Irreversible (FR-16, AC-16.2).
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /batches/{batch_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    post:
      tags: [Batches]
      operationId: cancelBatch
      summary: Cancel a queued or processing batch (Could)
      responses:
        '200':
          description: Batch cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidStateTransition' }

  /batches/{batch_id}/items:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Batches]
      operationId: listBatchItems
      summary: Analysed items of a batch, filterable and paginated
      description: Available while processing (partial results) and after completion (FR-08).
      parameters:
        - name: emotion
          in: query
          schema: { $ref: '#/components/schemas/Emotion' }
        - name: language
          in: query
          schema: { $ref: '#/components/schemas/Language' }
        - name: polarity
          in: query
          schema: { $ref: '#/components/schemas/Polarity' }
        - name: min_confidence
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
        - name: channel
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [row_number, -confidence, confidence, item_date, -item_date], default: row_number }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemList' }
              examples:
                angryKazakh:
                  summary: "?emotion=anger&language=kk&page=1&page_size=2"
                  value:
                    page: 1
                    page_size: 2
                    total: 214
                    items:
                      - id: 1048
                        row_number: 57
                        text: "Қосымша өте баяу жұмыс істейді, ақшам екі рет есептен шығып кетті!"
                        item_date: "2026-10-03T00:00:00Z"
                        channel: "App Store"
                        language: kk
                        emotion: anger
                        polarity: negative
                        confidence: 0.87
                        probabilities: { joy: 0.01, sadness: 0.06, anger: 0.87, fear: 0.03, surprise: 0.01, neutral: 0.02 }
                        truncated: false
                        corrected_emotion: null
                      - id: 1211
                        row_number: 220
                        text: "Үш күн күттім, ешкім жауап бермеді. Бұл қандай қызмет?"
                        item_date: "2026-10-05T00:00:00Z"
                        channel: "2GIS"
                        language: kk
                        emotion: anger
                        polarity: negative
                        confidence: 0.79
                        probabilities: { joy: 0.0, sadness: 0.14, anger: 0.79, fear: 0.02, surprise: 0.03, neutral: 0.02 }
                        truncated: false
                        corrected_emotion: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /batches/{batch_id}/stats:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Batches]
      operationId: getBatchStats
      summary: Aggregated statistics of a completed batch
      description: |
        Pre-computed once per batch (FR-09, AC-09.3). `timeline` is present only when a date column
        was mapped (FR-10). `top_examples` holds up to 5 highest-confidence items per emotion (FR-13).
        Returns 409 `BATCH_NOT_COMPLETED` while the batch is still processing.
      parameters:
        - name: granularity
          in: query
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchStats' }
              examples:
                completed:
                  value:
                    batch_id: "7f3c2a9e-5b1d-4c8e-9a6f-2d4b8e1c0a57"
                    analysed_count: 8400
                    by_emotion:
                      joy: { count: 2604, percent: 31.0 }
                      sadness: { count: 924, percent: 11.0 }
                      anger: { count: 1932, percent: 23.0 }
                      fear: { count: 336, percent: 4.0 }
                      surprise: { count: 420, percent: 5.0 }
                      neutral: { count: 2184, percent: 26.0 }
                    by_polarity:
                      positive: { count: 2604, percent: 31.0 }
                      negative: { count: 3192, percent: 38.0 }
                      neutral: { count: 2604, percent: 31.0 }
                    by_language:
                      kk: { count: 2520, percent: 30.0 }
                      ru: { count: 4620, percent: 55.0 }
                      mixed: { count: 1260, percent: 15.0 }
                    emotion_by_language:
                      kk: { joy: 756, sadness: 302, anger: 630, fear: 101, surprise: 101, neutral: 630 }
                      ru: { joy: 1478, sadness: 462, anger: 970, fear: 185, surprise: 254, neutral: 1271 }
                      mixed: { joy: 370, sadness: 160, anger: 332, fear: 50, surprise: 65, neutral: 283 }
                    mean_confidence: 0.78
                    low_confidence_count: 610
                    timeline:
                      granularity: week
                      points:
                        - period_start: "2026-09-28"
                          counts: { joy: 610, sadness: 230, anger: 402, fear: 80, surprise: 95, neutral: 540 }
                        - period_start: "2026-10-05"
                          counts: { joy: 655, sadness: 221, anger: 611, fear: 92, surprise: 101, neutral: 520 }
                    top_examples:
                      anger:
                        - { item_id: 1048, text: "Қосымша өте баяу жұмыс істейді, ақшам екі рет есептен шығып кетті!", language: kk, confidence: 0.87 }
                      joy:
                        - { item_id: 77, text: "Рахмет, қызмет көрсету керемет болды!", language: kk, confidence: 0.95 }
                      fear:
                        - { item_id: 3120, text: "Картамнан белгісіз біреу ақша алды, енді не істеймін, қорқып отырмын", language: kk, confidence: 0.81 }
                    computed_at: "2026-10-20T10:27:40Z"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BatchNotCompleted' }

  /batches/{batch_id}/export:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Batches]
      operationId: exportBatch
      summary: Download results (CSV — Must) or report (PDF — Could)
      description: |
        CSV contains the original columns plus `emotion`, `polarity`, `language`, `confidence`;
        UTF-8 with BOM so that Excel renders Kazakh letters (AC-12.1). Cells starting with
        `=`, `+`, `-`, `@` are escaped (CSV-injection protection).
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, pdf] }
      responses:
        '200':
          description: File download
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="reviews_october_emotions.csv"' }
          content:
            text/csv:
              schema: { type: string }
              example: |
                review,created,source,emotion,polarity,language,confidence
                "Қосымша өте баяу жұмыс істейді, ақшам екі рет есептен шығып кетті!",2026-10-03,App Store,anger,negative,kk,0.87
                "Спасибо большое, оператор быстро решил проблему!",2026-10-04,Google Play,joy,positive,ru,0.93
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BatchNotCompleted' }

  /items/{item_id}/label:
    parameters:
      - name: item_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Feedback]
      operationId: correctItemLabel
      summary: Correct the predicted emotion of an item (Could, FR-19)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelCorrection' }
            example: { corrected_emotion: sadness }
      responses:
        '200':
          description: Correction stored; original prediction kept
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in to the Web UI
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: "analyst@example.kz", password: "••••••••" }
      responses:
        '200':
          description: Session created; cookie `session` set (HttpOnly, Secure, SameSite=Lax)
          headers:
            Set-Cookie:
              schema: { type: string, example: "session=abc123; HttpOnly; Secure; SameSite=Lax; Path=/" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      security:
        - SessionCookie: []
      responses:
        '204': { description: Logged out }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/api-keys:
    get:
      tags: [Admin]
      operationId: listApiKeys
      summary: List API keys (Admin)
      security:
        - SessionCookie: []
      responses:
        '200':
          description: API keys (never contain the secret)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createApiKey
      summary: Create an API key (Admin). The secret is returned only once.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
            example: { name: "Helpdesk integration", user_id: "3d1f0c6a-2b7e-4a9d-8c5f-1e2a3b4c5d6e", rate_limit_per_min: 120 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
              example:
                id: "9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d"
                name: "Helpdesk integration"
                key_prefix: "kzr_7Hq2"
                rate_limit_per_min: 120
                created_at: "2026-10-20T09:00:00Z"
                revoked_at: null
                api_key: "kzr_7Hq2xV9pL4mN8sT1wB6yR3cF0dG5jK2"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/api-keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Admin]
      operationId: revokeApiKey
      summary: Revoke an API key (effective within 1 minute, AC-14.3)
      security:
        - SessionCookie: []
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List users (Admin)
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createUser
      summary: Create a user (Admin)
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Change role or deactivate a user (Admin)
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
            example: { role: admin }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/status:
    get:
      tags: [Admin]
      operationId: getSystemStatus
      summary: Operational status (Admin, AC-17.2)
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
              example:
                model_version: "emotion-xlmr-kkru-v0.1.0"
                queue_length: 2
                batches_last_24h: 14
                items_last_24h: 61230
                single_requests_last_24h: 3480
                p95_analyze_ms_last_24h: 640
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness and dependency status (no auth)
      security: []
      responses:
        '200':
          description: Service is up; `status` is `degraded` if a dependency fails
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              examples:
                ok:
                  value: { status: ok, database: ok, broker: ok, ml_service: ok, version: "1.0.0" }
                degraded:
                  value: { status: degraded, database: ok, broker: ok, ml_service: down, version: "1.0.0" }

  /model:
    get:
      tags: [System]
      operationId: getModelInfo
      summary: Active model and its evaluation summary (FR-18, AC-18.2)
      responses:
        '200':
          description: Model information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelInfo' }
              example:
                name: "XLM-RoBERTa-base fine-tuned for KZ/RU emotions"
                version: "emotion-xlmr-kkru-v0.1.0"
                base_model: "xlm-roberta-base"
                trained_at: "2027-01-15T00:00:00Z"
                labels: [joy, sadness, anger, fear, surprise, neutral]
                max_text_length: 2000
                max_tokens: 512
                metrics:
                  test_set_size: { kk: 600, ru: 600, mixed: 400 }
                  macro_f1: { kk: null, ru: null, mixed: null, overall: null }
                  note: "Placeholder values; filled after the first evaluation run (DIP-25)."
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Issued by an administrator; stored only as a salted hash (FR-14).
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Web UI session created by `POST /auth/login` (FR-15).

  headers:
    X-Request-ID:
      description: Correlation ID propagated to worker and ML-service logs (NFR-15)
      schema: { type: string }
    X-RateLimit-Remaining:
      description: Requests left in the current one-minute window
      schema: { type: integer }

  parameters:
    BatchId:
      name: batch_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  schemas:
    Emotion:
      type: string
      enum: [joy, sadness, anger, fear, surprise, neutral]
    Polarity:
      type: string
      enum: [positive, negative, neutral]
    Language:
      type: string
      enum: [kk, ru, mixed]
      description: "kk = Kazakh, ru = Russian, mixed = both in one text (FR-02)"
    BatchStatus:
      type: string
      enum: [queued, processing, completed, failed, cancelled]
    Probabilities:
      type: object
      description: Softmax probabilities over the six labels; sum = 1 ± 0.001 (AC-03.1)
      required: [joy, sadness, anger, fear, surprise, neutral]
      additionalProperties: false
      properties:
        joy: { type: number, minimum: 0, maximum: 1 }
        sadness: { type: number, minimum: 0, maximum: 1 }
        anger: { type: number, minimum: 0, maximum: 1 }
        fear: { type: number, minimum: 0, maximum: 1 }
        surprise: { type: number, minimum: 0, maximum: 1 }
        neutral: { type: number, minimum: 0, maximum: 1 }

    AnalyzeRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: Text to analyse (Kazakh, Russian or mixed). Whitespace-only text is rejected.
        store:
          type: boolean
          default: false
          description: Persist the text in the analysis log (AC-01.5)
    AnalyzeResponse:
      type: object
      required: [request_id, text_length, language, emotion, polarity, confidence, probabilities, truncated, model_version, processing_ms]
      properties:
        request_id: { type: string }
        text_length: { type: integer, minimum: 1 }
        language: { $ref: '#/components/schemas/Language' }
        emotion: { $ref: '#/components/schemas/Emotion' }
        polarity: { $ref: '#/components/schemas/Polarity' }
        confidence: { type: number, minimum: 0, maximum: 1, description: "= max(probabilities)" }
        probabilities: { $ref: '#/components/schemas/Probabilities' }
        truncated: { type: boolean, description: "true if the text exceeded 512 subword tokens" }
        model_version: { type: string }
        processing_ms: { type: integer, minimum: 0 }

    ColumnMap:
      type: object
      properties:
        text_column: { type: [string, 'null'], description: "Header of the text column; auto-detected if null (AC-06.2)" }
        date_column: { type: [string, 'null'] }
        channel_column: { type: [string, 'null'] }
    BatchUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: ".csv, .xlsx or .txt; ≤ 10 MB; ≤ 50,000 items"
        name:
          type: string
          maxLength: 200
          description: Display name; defaults to the file name
        text_column: { type: string }
        date_column: { type: string }
        channel_column: { type: string }
    Batch:
      type: object
      required: [id, name, original_filename, file_format, status, progress, total_count, processed_count, skipped_count, truncated_count, invalid_date_count, column_map, model_version, error_message, created_at, started_at, finished_at, expires_at, links]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        original_filename: { type: string }
        file_format: { type: string, enum: [csv, xlsx, txt] }
        status: { $ref: '#/components/schemas/BatchStatus' }
        progress: { type: number, minimum: 0, maximum: 100, description: "processed_count / total_count × 100" }
        total_count: { type: integer, minimum: 0, description: "0 until the worker has parsed the file" }
        processed_count: { type: integer, minimum: 0 }
        skipped_count: { type: integer, minimum: 0, description: "Empty rows (AC-05.4)" }
        truncated_count: { type: integer, minimum: 0 }
        invalid_date_count: { type: integer, minimum: 0 }
        column_map: { $ref: '#/components/schemas/ColumnMap' }
        model_version: { type: string }
        error_message: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time, description: "Retention deadline (AC-16.3)" }
        links:
          type: object
          required: [self, items, stats, export]
          properties:
            self: { type: string }
            items: { type: string }
            stats: { type: string }
            export: { type: string }
    BatchList:
      type: object
      required: [page, page_size, total, batches]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        batches:
          type: array
          items: { $ref: '#/components/schemas/Batch' }

    Item:
      type: object
      required: [id, row_number, text, item_date, channel, language, emotion, polarity, confidence, probabilities, truncated, corrected_emotion]
      properties:
        id: { type: integer, format: int64 }
        row_number: { type: integer, minimum: 1 }
        text: { type: string }
        item_date: { type: [string, 'null'], format: date-time }
        channel: { type: [string, 'null'] }
        language: { $ref: '#/components/schemas/Language' }
        emotion: { $ref: '#/components/schemas/Emotion' }
        polarity: { $ref: '#/components/schemas/Polarity' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        probabilities: { $ref: '#/components/schemas/Probabilities' }
        truncated: { type: boolean }
        corrected_emotion:
          description: Analyst correction (FR-19); null if not corrected
          oneOf:
            - $ref: '#/components/schemas/Emotion'
            - type: 'null'
    ItemList:
      type: object
      required: [page, page_size, total, items]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Number of items matching the filters" }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }

    CountPercent:
      type: object
      required: [count, percent]
      properties:
        count: { type: integer, minimum: 0 }
        percent: { type: number, minimum: 0, maximum: 100 }
    EmotionCounts:
      type: object
      required: [joy, sadness, anger, fear, surprise, neutral]
      additionalProperties: false
      properties:
        joy: { type: integer, minimum: 0 }
        sadness: { type: integer, minimum: 0 }
        anger: { type: integer, minimum: 0 }
        fear: { type: integer, minimum: 0 }
        surprise: { type: integer, minimum: 0 }
        neutral: { type: integer, minimum: 0 }
    Example:
      type: object
      required: [item_id, text, language, confidence]
      properties:
        item_id: { type: integer, format: int64 }
        text: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        confidence: { type: number, minimum: 0, maximum: 1 }
    BatchStats:
      type: object
      required: [batch_id, analysed_count, by_emotion, by_polarity, by_language, emotion_by_language, mean_confidence, low_confidence_count, top_examples, computed_at]
      properties:
        batch_id: { type: string, format: uuid }
        analysed_count: { type: integer, minimum: 0 }
        by_emotion:
          type: object
          required: [joy, sadness, anger, fear, surprise, neutral]
          additionalProperties: false
          properties:
            joy: { $ref: '#/components/schemas/CountPercent' }
            sadness: { $ref: '#/components/schemas/CountPercent' }
            anger: { $ref: '#/components/schemas/CountPercent' }
            fear: { $ref: '#/components/schemas/CountPercent' }
            surprise: { $ref: '#/components/schemas/CountPercent' }
            neutral: { $ref: '#/components/schemas/CountPercent' }
        by_polarity:
          type: object
          required: [positive, negative, neutral]
          additionalProperties: false
          properties:
            positive: { $ref: '#/components/schemas/CountPercent' }
            negative: { $ref: '#/components/schemas/CountPercent' }
            neutral: { $ref: '#/components/schemas/CountPercent' }
        by_language:
          type: object
          required: [kk, ru, mixed]
          additionalProperties: false
          properties:
            kk: { $ref: '#/components/schemas/CountPercent' }
            ru: { $ref: '#/components/schemas/CountPercent' }
            mixed: { $ref: '#/components/schemas/CountPercent' }
        emotion_by_language:
          type: object
          required: [kk, ru, mixed]
          additionalProperties: false
          properties:
            kk: { $ref: '#/components/schemas/EmotionCounts' }
            ru: { $ref: '#/components/schemas/EmotionCounts' }
            mixed: { $ref: '#/components/schemas/EmotionCounts' }
        mean_confidence: { type: number, minimum: 0, maximum: 1 }
        low_confidence_count: { type: integer, minimum: 0, description: "Items with confidence < 0.5; shown as a 'needs review' hint" }
        timeline:
          type: object
          required: [granularity, points]
          properties:
            granularity: { type: string, enum: [day, week, month] }
            points:
              type: array
              items:
                type: object
                required: [period_start, counts]
                properties:
                  period_start: { type: string, format: date }
                  counts: { $ref: '#/components/schemas/EmotionCounts' }
        top_examples:
          type: object
          description: Up to 5 highest-confidence items per emotion (FR-13)
          propertyNames: { $ref: '#/components/schemas/Emotion' }
          additionalProperties:
            type: array
            maxItems: 5
            items: { $ref: '#/components/schemas/Example' }
        computed_at: { type: string, format: date-time }

    LabelCorrection:
      type: object
      required: [corrected_emotion]
      properties:
        corrected_emotion: { $ref: '#/components/schemas/Emotion' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, format: password }
    User:
      type: object
      required: [id, email, role, is_active, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [analyst, admin] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, format: password }
        role: { type: string, enum: [analyst, admin] }
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        role: { type: string, enum: [analyst, admin] }
        is_active: { type: boolean }

    ApiKey:
      type: object
      required: [id, name, key_prefix, rate_limit_per_min, created_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string, description: "First 8 characters, for identification only" }
        rate_limit_per_min: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    ApiKeyCreate:
      type: object
      required: [name, user_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        user_id: { type: string, format: uuid }
        rate_limit_per_min: { type: integer, minimum: 1, maximum: 6000, default: 60 }
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [api_key]
          properties:
            api_key: { type: string, description: "Plain secret. Shown only in this response (AC-14.2)." }

    SystemStatus:
      type: object
      required: [model_version, queue_length, batches_last_24h, items_last_24h, single_requests_last_24h, p95_analyze_ms_last_24h]
      properties:
        model_version: { type: string }
        queue_length: { type: integer, minimum: 0 }
        batches_last_24h: { type: integer, minimum: 0 }
        items_last_24h: { type: integer, minimum: 0 }
        single_requests_last_24h: { type: integer, minimum: 0 }
        p95_analyze_ms_last_24h: { type: [integer, 'null'], minimum: 0 }
    Health:
      type: object
      required: [status, database, broker, ml_service, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, down] }
        broker: { type: string, enum: [ok, down] }
        ml_service: { type: string, enum: [ok, down] }
        version: { type: string }
    ModelInfo:
      type: object
      required: [name, version, base_model, trained_at, labels, max_text_length, max_tokens, metrics]
      properties:
        name: { type: string }
        version: { type: string }
        base_model: { type: string }
        trained_at: { type: string, format: date-time }
        labels:
          type: array
          items: { $ref: '#/components/schemas/Emotion' }
          minItems: 6
          maxItems: 6
        max_text_length: { type: integer }
        max_tokens: { type: integer }
        metrics:
          type: object
          properties:
            test_set_size:
              type: object
              additionalProperties: { type: integer }
            macro_f1:
              type: object
              additionalProperties: { type: [number, 'null'] }
            note: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [TEXT_EMPTY, TEXT_TOO_LONG, VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND,
                     BATCH_TOO_LARGE, UNSUPPORTED_FILE, TEXT_COLUMN_NOT_FOUND, BATCH_NOT_COMPLETED,
                     INVALID_STATE_TRANSITION, RATE_LIMITED, MODEL_UNAVAILABLE, INTERNAL_ERROR]
            message: { type: string, description: "Human-readable, in the language of Accept-Language (ru/en)" }
            details: { type: [object, 'null'] }
            request_id: { type: string }

  responses:
    Unauthorized:
      description: Missing or invalid credentials (AC-04.3)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: UNAUTHORIZED, message: "Invalid or missing API key", details: null, request_id: "req_01JB7R0K" }
    Forbidden:
      description: Authenticated but not allowed (role)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: FORBIDDEN, message: "Administrator role required", details: null, request_id: "req_01JB7R0L" }
    NotFound:
      description: Resource does not exist or belongs to another user (AC-08.4)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: NOT_FOUND, message: "Batch not found", details: null, request_id: "req_01JB7R0M" }
    TextValidationError:
      description: Text is empty or longer than 2,000 characters (AC-04.1, AC-04.2)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            empty:
              value:
                error: { code: TEXT_EMPTY, message: "Text must not be empty", details: { field: "text" }, request_id: "req_01JB7R0N" }
            tooLong:
              value:
                error: { code: TEXT_TOO_LONG, message: "Text exceeds 2000 characters", details: { field: "text", max_length: 2000, actual_length: 2417 }, request_id: "req_01JB7R0P" }
    ValidationError:
      description: Invalid parameters or body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: VALIDATION_ERROR, message: "page_size must be ≤ 200", details: { field: "page_size" }, request_id: "req_01JB7R0Q" }
    BatchTooLarge:
      description: File > 10 MB or > 50,000 items (AC-05.2)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: BATCH_TOO_LARGE, message: "File exceeds 10 MB", details: { max_bytes: 10485760, actual_bytes: 15204352 }, request_id: "req_01JB7R0R" }
    UnsupportedFile:
      description: Extension or encoding not supported (AC-05.3)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: UNSUPPORTED_FILE, message: "Supported formats: .csv, .xlsx, .txt (UTF-8)", details: { extension: ".docx" }, request_id: "req_01JB7R0S" }
    TextColumnNotFound:
      description: No text column specified or auto-detected (AC-06.2)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: TEXT_COLUMN_NOT_FOUND, message: "Specify text_column", details: { available_columns: ["id", "Мәтін", "Күні", "Арна"] }, request_id: "req_01JB7R0T" }
    BatchNotCompleted:
      description: Statistics or export requested before the batch completed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: BATCH_NOT_COMPLETED, message: "Batch is still processing", details: { status: processing, progress: 41.6 }, request_id: "req_01JB7R0U" }
    InvalidStateTransition:
      description: Operation not allowed in the current batch status (AC-07.2)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: INVALID_STATE_TRANSITION, message: "Cannot cancel a completed batch", details: { from: completed, to: cancelled }, request_id: "req_01JB7R0V" }
    RateLimited:
      description: Rate limit exceeded (AC-14.4)
      headers:
        Retry-After:
          schema: { type: integer, example: 23 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: RATE_LIMITED, message: "Rate limit of 60 requests/min exceeded", details: { retry_after_s: 23 }, request_id: "req_01JB7R0W" }
    ModelUnavailable:
      description: ML inference service unreachable or timed out (AC-04.5)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: MODEL_UNAVAILABLE, message: "Emotion model is temporarily unavailable", details: null, request_id: "req_01JB7R0X" }
